<nav aria-label="Breadcrumb" class="breadcrumb" [class.font-accent]="isPersonContext()">
    <ul class="breadcrumb__list">
        @for (item of items(); track item.label; let last = $last) {
        <li class="breadcrumb__item" [class.breadcrumb__item--active]="last">
            @if (!last && item.url) {
            <a class="breadcrumb__link" [routerLink]="item.url">{{ item.label | translate }}</a>
            } @else {
            <span class="breadcrumb__text">{{ item.label | translate }}</span>
            } @if (!last) {
            <span class="breadcrumb__separator" aria-hidden="true">{{ isPersonContext() ? '/' : '›' }}</span>
            }
        </li>
        }
    </ul>
</nav>
