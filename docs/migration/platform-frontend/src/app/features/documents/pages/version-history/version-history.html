<p-table [value]="versions()" [loading]="loading()" styleClass="p-datatable-sm" dataKey="id">
    <ng-template pTemplate="header">
        <tr>
            <th>Versão</th>
            <th>Título</th>
            <th>Criado em</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-v>
        <tr>
            <td><span class="font-mono">v{{ v.version }}</span></td>
            <td>{{ v.title }}</td>
            <td>{{ v.created_at | dateFormat }}</td>
        </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="3">
                <div class="table-empty-state">
                    <div class="empty-icon-wrapper"><i class="pi pi-history"></i></div>
                    <span class="empty-label">Nenhuma versão anterior.</span>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>
