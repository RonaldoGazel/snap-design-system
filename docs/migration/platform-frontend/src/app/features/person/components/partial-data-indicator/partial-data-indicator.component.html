<div class="partial-data">
    <div class="partial-data__header">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ message() }}</span>
    </div>
    @if (missingFields().length) {
    <ul class="partial-data__fields">
        @for (field of missingFields(); track field) {
        <li>{{ field }}</li>
        }
    </ul>
    }
</div>
