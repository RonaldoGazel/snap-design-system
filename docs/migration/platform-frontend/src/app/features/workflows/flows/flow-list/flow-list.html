<div class="flow-list">
  <div class="flow-list__header">
    <h2>Fluxos</h2>
    <button pButton label="Novo Fluxo" icon="pi pi-plus" (click)="navigateToNew()"></button>
  </div>

  <div class="flow-list__filters">
    <input
      pInputText
      type="text"
      placeholder="Buscar por código ou nome..."
      [ngModel]="searchText()"
      (ngModelChange)="searchText.set($event)"
    />
    <p-select
      [options]="statusOptions"
      [ngModel]="filterStatus()"
      (ngModelChange)="filterStatus.set($event)"
      optionLabel="label"
      optionValue="value"
      placeholder="Status"
    />
    <p-select
      [options]="docTypes()"
      [ngModel]="filterDocTypeId()"
      (ngModelChange)="filterDocTypeId.set($event)"
      optionLabel="name"
      optionValue="id"
      placeholder="Tipo Documental"
      [showClear]="true"
    />
  </div>

  <p-table [value]="filteredFlows()" [paginator]="true" [rows]="15">
    <ng-template #header>
      <tr>
        <th>Código</th>
        <th>Nome</th>
        <th>Status</th>
        <th>Tipos Documentais</th>
        <th>Versões</th>
        <th>Ações</th>
      </tr>
    </ng-template>
    <ng-template #body let-flow>
      <tr>
        <td>{{ flow.code }}</td>
        <td>{{ flow.name }}</td>
        <td>
          <p-tag [value]="statusLabel(flow.status) | translate" [severity]="statusSeverity(flow.status)" />
        </td>
        <td>{{ docTypeNames(flow) }}</td>
        <td>{{ versionsCount(flow) }}</td>
        <td>
          <button
            pButton
            icon="pi pi-eye"
            class="p-button-text p-button-sm"
            (click)="navigateToDetail(flow)"
            title="Ver detalhe"
          ></button>
          <button
            pButton
            icon="pi pi-copy"
            class="p-button-text p-button-sm"
            (click)="duplicateFlow(flow)"
            title="Duplicar"
          ></button>
          <button
            pButton
            icon="pi pi-pencil"
            class="p-button-text p-button-sm"
            (click)="navigateToEdit(flow)"
            title="Editar"
          ></button>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="6" class="text-center text-color-secondary">Nenhum fluxo encontrado.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
